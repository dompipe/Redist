name: Publish static dashboard preview

on:
  push:
    branches: [dashboard-static-preview]
    paths:
      - "preview/**"
      - ".github/workflows/dashboard-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only the isolated preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
