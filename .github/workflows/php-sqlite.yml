name: PHP SQLite checks
on:
  push:
    branches: [feature/completed-wave-dispatch]
  pull_request:
    branches: [master]
jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo_sqlite
          coverage: none
      - name: Lint changed PHP files
        run: |
          php -l Redist/storage/SqliteStore.php
          php -l Redist/storage/migrate.php
          php -l Redist/curl/WaveQueue.php
          php -l Redist/curl/curl.php
          php -l Redist/files/filemngr.php
          php -l Redist/url/purl.php
          php -l dashboard.php
      - name: SQLite wave and queue smoke test
        run: php tests/sqlite_smoke.php
